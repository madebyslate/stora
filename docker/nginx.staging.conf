# Stage 1 staging router. There is deliberately no Payload upstream here: an
# upstream pointing at a service that does not exist prevents Nginx from
# starting, even if no visitor requests /admin or /api.

server {
    listen 8080;
    server_name _;

    absolute_redirect off;
    port_in_redirect off;

    root /srv/website/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /admin {
        return 404;
    }

    location ^~ /admin/ {
        return 404;
    }

    location = /api {
        return 404;
    }

    location ^~ /api/ {
        return 404;
    }

    location ^~ /_next/ {
        return 404;
    }

    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /video/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location = /sitemap-index.xml {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
